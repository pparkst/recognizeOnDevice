<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹 온디바이스 실시간 객체 인식</title>
  <!-- ONNX Runtime Web CDN 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.all.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    h2 { 
      margin: 10px 0 5px 0; 
      font-size: 1.1rem;
    }
    #status {
      margin-bottom: 10px;
      color: #00ffcc;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      padding: 0 10px;
    }
    .container {
      position: relative;
      width: 100%;
      flex: 1; /* 남은 화면 전체 채우기 */
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* 화면 비율에 맞게 채우기 */
    }
  </style>
</head>
<body>

  <h2>온디바이스 실시간 객체 인식</h2>
  <div id="status">모델 로딩 중... 잠시만 기다려주세요.</div>

  <div class="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <script>
    // COCO 데이터셋 80개 클래스 이름
    const COCO_CLASSES = [
      'person', 'bicycle', 'car', 'motorcycle', 'airplane', 'bus', 'train', 'truck', 'boat', 'traffic light',
      'fire hydrant', 'stop sign', 'parking meter', 'bench', 'bird', 'cat', 'dog', 'horse', 'sheep', 'cow',
      'elephant', 'bear', 'zebra', 'giraffe', 'backpack', 'umbrella', 'handbag', 'tie', 'suitcase', 'frisbee',
      'skis', 'snowboard', 'sports ball', 'kite', 'baseball bat', 'baseball glove', 'skateboard', 'surfboard',
      'tennis racket', 'bottle', 'wine glass', 'cup', 'fork', 'knife', 'spoon', 'bowl', 'banana', 'apple',
      'sandwich', 'orange', 'broccoli', 'carrot', 'hot dog', 'pizza', 'donut', 'cake', 'chair', 'couch',
      'potted plant', 'bed', 'dining table', 'toilet', 'tv', 'laptop', 'mouse', 'remote', 'keyboard', 'cell phone',
      'microwave', 'oven', 'toaster', 'sink', 'refrigerator', 'book', 'clock', 'vase', 'scissors', 'teddy bear',
      'hair drier', 'toothbrush'
    ];

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');

    let session = null;
    const MODEL_SIZE = 640;

    // 1. 카메라 시작
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }, // 스마트폰 후면 카메라 우선
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        return new Promise((resolve) => {
          video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            resolve();
          }; 
        });
      } catch (err) {
        statusDiv.innerText = "카메라 접근 실패: HTTPS 환경이거나 권한이 거부되었습니다.";
        console.error(err);
      }
    }

    // 2. ONNX 세션 및 모델 로드
    async function loadModel() {
      try {
        // WebAssembly(WASM) 실행 옵션 설정
        ort.env.wasm.numThreads = 2;
        // 동등 경로의 'yolo26n.onnx' 파일 로드
        session = await ort.InferenceSession.create('../yolo26n.onnx', {
          executionProviders: ['webgpu','wasm']
        });
        statusDiv.innerText = "✅ 모델 로드 완료! 실시간 추론 중...";
      } catch (err) {
        statusDiv.innerText = "모델 로드 실패: yolo26n.onnx 파일이 같은 경로에 있는지 확인하세요.";
        console.error(err);
      }
    }

    // 3. 비디오 프레임 Preprocessing (Float32Array [1, 3, 640, 640] 텐서 생성)
    function preprocess(videoElement) {
      const offscreen = document.createElement('canvas');
      offscreen.width = MODEL_SIZE;
      offscreen.height = MODEL_SIZE;
      const offCtx = offscreen.getContext('2d');
      offCtx.drawImage(videoElement, 0, 0, MODEL_SIZE, MODEL_SIZE);

      const imgData = offCtx.getImageData(0, 0, MODEL_SIZE, MODEL_SIZE);
      const { data } = imgData; // RGBA 데이터

      const float32Data = new Float32Array(3 * MODEL_SIZE * MODEL_SIZE);

      // NCHW 형태 (1, 3, 640, 640)로 정규화 (0~255 -> 0~1)
      for (let i = 0; i < MODEL_SIZE * MODEL_SIZE; i++) {
        float32Data[i] = data[i * 4] / 255.0;                         // Red
        float32Data[MODEL_SIZE * MODEL_SIZE + i] = data[i * 4 + 1] / 255.0; // Green
        float32Data[2 * MODEL_SIZE * MODEL_SIZE + i] = data[i * 4 + 2] / 255.0; // Blue
      }

      return new ort.Tensor('float32', float32Data, [1, 3, MODEL_SIZE, MODEL_SIZE]);
    }

    // 4. YOLOv8 출력 파싱 (Postprocessing)
    function processOutput(output, confidenceThreshold = 0.45) {
      const boxes = [];
      const [batch, channels, numAnchors] = output.dims; // [1, 84, 8400]
      const data = output.data;

      // output shape: [84, 8400] -> 8400개 바운딩 박스 탐색
      for (let i = 0; i < numAnchors; i++) {
        let maxScore = 0;
        let classId = -1;

        // 84개 값 중 앞 4개(x, y, w, h)를 제외한 80개 클래스 확률 비교
        for (let c = 0; c < 80; c++) {
          const score = data[(4 + c) * numAnchors + i];
          if (score > maxScore) {
            maxScore = score;
            classId = c;
          }
        }

        if (maxScore > confidenceThreshold) {
          const xc = data[0 * numAnchors + i];
          const yc = data[1 * numAnchors + i];
          const w = data[2 * numAnchors + i];
          const h = data[3 * numAnchors + i];

          // 640x640 비율을 실제 비디오/캔버스 크기에 맞춰 스케일링
          const scaleX = canvas.width / MODEL_SIZE;
          const scaleY = canvas.height / MODEL_SIZE;

          const x = (xc - w / 2) * scaleX;
          const y = (yc - h / 2) * scaleY;
          const width = w * scaleX;
          const height = h * scaleY;

          boxes.push({ x, y, width, height, classId, score: maxScore });
        }
      }
      return boxes;
    }

    // 5. Canvas 상에 결과 렌더링
    function drawBoxes(boxes) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      boxes.forEach(box => {
        // 박스 그리기
        ctx.strokeStyle = '#00FF00';
        ctx.lineWidth = 3;
        ctx.strokeRect(box.x, box.y, box.width, box.height);

        // 라벨 텍스트 배경 및 텍스트 작성
        const label = `${COCO_CLASSES[box.classId]} ${(box.score * 100).toFixed(0)}%`;
        ctx.fillStyle = '#00FF00';
        ctx.font = '16px sans-serif';
        const textWidth = ctx.measureText(label).width;

        ctx.fillRect(box.x, box.y - 22, textWidth + 10, 22);

        ctx.fillStyle = '#000000';
        ctx.fillText(label, box.x + 5, box.y - 5);
      });
    }

    // 6. 실시간 추론 메인 루프
    async function renderLoop() {
      if (session && video.readyState === 4) {
        const inputTensor = preprocess(video);
        const outputs = await session.run({ images: inputTensor });
        
        const outputTensor = outputs[Object.keys(outputs)[0]];
        const boxes = processOutput(outputTensor);
        
        drawBoxes(boxes);
      }
      requestAnimationFrame(renderLoop);
    }

    // 실행 시작
    async function main() {
      await startCamera();
      await loadModel();
      renderLoop();
    }

    main();
  </script>
</body>
</html>
